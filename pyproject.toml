[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-profiler"
version = "2.0.0"
description = "Personal CLI to generate tailored, honest, ATS-friendly CVs from verified evidence and job descriptions."
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.0",
  "PyYAML>=6.0",
]

[project.scripts]
cv = "cv_profiler:main"
cv-profiler = "cv_profiler:main"

[tool.setuptools]
py-modules = ["cv_profiler", "llm_grill"]
